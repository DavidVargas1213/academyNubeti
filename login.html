<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión · Nubeti Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg-2:#141414;--ink:#FDFBF2;--ink-dim:#c9c4b4;--ink-mute:#7a766c;--line:#232320;--line-strong:#38352f;--accent:#FB602B;--danger:#e07555;--font-display:'JetBrains Mono',ui-monospace,monospace;--font-body:'Inter','Helvetica Neue',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(251,96,43,0.08),transparent 60%),var(--bg);color:var(--ink);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.card{width:100%;max-width:380px;border:1px solid var(--line-strong);background:var(--bg-2);padding:2.4rem 2.2rem;border-radius:4px}
.kicker{font-family:var(--font-display);font-size:.68rem;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:.8rem}
h1{font-family:var(--font-display);font-weight:600;font-size:1.4rem;letter-spacing:-.01em;margin-bottom:1.8rem}
label{display:block;font-family:var(--font-display);font-size:.68rem;letter-spacing:.15em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:.4rem}
input{width:100%;background:var(--bg);border:1px solid var(--line-strong);color:var(--ink);padding:.75rem .9rem;font-size:.95rem;border-radius:2px;margin-bottom:1.2rem;font-family:var(--font-body)}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;background:var(--accent);color:var(--bg);border:none;padding:.85rem;font-family:var(--font-display);font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;font-weight:600;cursor:pointer;border-radius:2px;transition:opacity .2s}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.error{color:var(--danger);font-size:.85rem;margin-top:1rem;display:none}
.error.show{display:block}
.foot{margin-top:1.6rem;text-align:center;color:var(--ink-mute);font-size:.78rem}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nubeti">
</head>
<body>
<form class="card" id="loginForm">
  <div class="kicker">◆ Nubeti Academy</div>
  <h1>Iniciar sesión</h1>
  <label for="email">Correo</label>
  <input type="email" id="email" required autocomplete="email">
  <label for="password">Contraseña</label>
  <input type="password" id="password" required autocomplete="current-password">
  <button type="submit" id="submitBtn">Entrar</button>
  <div class="error" id="errorMsg"></div>
  <div class="foot">¿No tienes cuenta? Pídele acceso al administrador del equipo.</div>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth.js"></script>
<script>
(async () => {
  const { data: { session } } = await window.sb.auth.getSession();
  if (session) { location.href = 'index.html'; return; }
})();

const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Entrando…';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await window.sb.auth.signInWithPassword({ email, password });
  if (error) {
    errorMsg.textContent = `${error.message} (código: ${error.status || error.code || 's/d'})`;
    errorMsg.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Entrar';
    return;
  }
  location.href = 'index.html';
});
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
