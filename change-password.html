<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar Contraseña · Nubeti Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg-2:#141414;--ink:#FDFBF2;--ink-dim:#c9c4b4;--ink-mute:#7a766c;--line-strong:#38352f;--accent:#FB602B;--danger:#e07555;--ok:#7fa66a;--font-display:'JetBrains Mono',ui-monospace,monospace;--font-body:'Inter','Helvetica Neue',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(251,96,43,0.08),transparent 60%),var(--bg);color:var(--ink);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.card{width:100%;max-width:400px;border:1px solid var(--line-strong);background:var(--bg-2);padding:2.4rem 2.2rem;border-radius:4px}
.kicker{font-family:var(--font-display);font-size:.68rem;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:.8rem}
h1{font-family:var(--font-display);font-weight:600;font-size:1.3rem;letter-spacing:-.01em;margin-bottom:.6rem}
.note{color:var(--ink-mute);font-size:.85rem;margin-bottom:1.6rem;line-height:1.5}
label{display:block;font-family:var(--font-display);font-size:.68rem;letter-spacing:.15em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:.4rem}
input{width:100%;background:var(--bg);border:1px solid var(--line-strong);color:var(--ink);padding:.75rem .9rem;font-size:.95rem;border-radius:2px;margin-bottom:1.2rem;font-family:var(--font-body)}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;background:var(--accent);color:var(--bg);border:none;padding:.85rem;font-family:var(--font-display);font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;font-weight:600;cursor:pointer;border-radius:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:.85rem;margin-top:1rem;display:none}
.msg.show{display:block}
</style>
</head>
<body>
<form class="card" id="pwForm">
  <div class="kicker">◆ Nubeti Academy</div>
  <h1>Cambiar contraseña</h1>
  <div class="note" id="note">Por seguridad, elige una nueva contraseña.</div>
  <label for="pw1">Nueva contraseña</label>
  <input type="password" id="pw1" required minlength="6" autocomplete="new-password">
  <label for="pw2">Repetir contraseña</label>
  <input type="password" id="pw2" required minlength="6" autocomplete="new-password">
  <button type="submit" id="submitBtn">Guardar y continuar</button>
  <div class="msg" id="msg"></div>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth.js"></script>
<script>
(async () => {
  const { data: { session } } = await window.sb.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }
})();

const form = document.getElementById('pwForm');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.classList.remove('show');
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw1 !== pw2) {
    msg.style.color = 'var(--danger)';
    msg.textContent = 'Las contraseñas no coinciden.';
    msg.classList.add('show');
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = 'Guardando…';

  const { error: updErr } = await window.sb.auth.updateUser({ password: pw1 });
  if (updErr) {
    msg.style.color = 'var(--danger)';
    msg.textContent = updErr.message;
    msg.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Guardar y continuar';
    return;
  }

  await window.sb.rpc('clear_must_change_password');
  location.href = 'index.html';
});
</script>
</body>
</html>
