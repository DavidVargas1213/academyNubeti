<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin · Nubeti Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg-2:#141414;--ink:#FDFBF2;--ink-dim:#c9c4b4;--ink-mute:#7a766c;--line:#232320;--line-strong:#38352f;--accent:#FB602B;--ok:#7fa66a;--font-display:'JetBrains Mono',ui-monospace,monospace;--font-title:'Fraunces',serif;--font-body:'Inter','Helvetica Neue',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6}
body{padding:5rem 2rem 4rem;min-height:100vh}
a{color:inherit}
.back{position:fixed;top:1.4rem;left:2rem;z-index:10;font-family:var(--font-display);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);text-decoration:none;padding:.5rem .8rem;border:1px solid var(--line-strong);border-radius:2px;background:rgba(10,10,10,.7)}
.back:hover{color:var(--accent);border-color:var(--accent)}
article{max-width:1100px;margin:0 auto}
.kicker{font-family:var(--font-display);font-size:.7rem;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:.8rem}
h1{font-family:var(--font-title);font-weight:600;font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:2.5rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--font-display);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-mute);padding:.7rem .9rem;border-bottom:1px solid var(--line-strong)}
td{padding:.9rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:rgba(251,96,43,.03)}
.name{font-family:var(--font-title);font-size:1rem}
.email{color:var(--ink-mute);font-size:.8rem}
.bar-cell{display:flex;align-items:center;gap:.6rem;min-width:160px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#ff8a5c,var(--accent))}
.pct{font-family:var(--font-display);font-size:.8rem;color:var(--accent);min-width:2.6rem;text-align:right}
.expand{cursor:pointer;font-family:var(--font-display);font-size:.68rem;color:var(--ink-mute);text-decoration:underline}
.detail-row td{background:var(--bg-2);padding:1rem 1.4rem}
.detail-row{display:none}
.detail-row.show{display:table-row}
.detail-course{display:flex;justify-content:space-between;font-size:.85rem;padding:.35rem 0;border-bottom:1px solid var(--line);color:var(--ink-dim)}
.loading{text-align:center;padding:6rem 2rem;color:var(--ink-mute);font-family:var(--font-title);font-size:1.2rem}
.denied{text-align:center;padding:8rem 2rem;color:var(--ink-mute);font-family:var(--font-title);font-size:1.3rem}
.create-box{border:1px solid var(--line-strong);background:var(--bg-2);padding:1.4rem 1.6rem;margin-bottom:2.5rem}
.create-box h3{font-family:var(--font-title);font-size:1.1rem;margin-bottom:1rem}
.create-row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:flex-end}
.create-row .field{display:flex;flex-direction:column;gap:.3rem}
.create-row label{font-family:var(--font-display);font-size:.62rem;letter-spacing:.15em;color:var(--ink-mute);text-transform:uppercase}
.create-row input{background:var(--bg);border:1px solid var(--line-strong);color:var(--ink);padding:.6rem .8rem;border-radius:2px;font-size:.9rem;min-width:200px}
.btn{background:var(--accent);color:var(--bg);border:none;padding:.65rem 1.1rem;font-family:var(--font-display);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink-dim)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.create-msg{margin-top:1rem;font-size:.88rem;display:none;padding:.8rem 1rem;border-radius:2px}
.create-msg.show{display:block}
.create-msg.ok{background:rgba(127,166,106,.1);color:#c8e2b0;border:1px solid var(--ok)}
.create-msg.err{background:rgba(224,117,85,.1);color:#e8a094;border:1px solid var(--danger)}
.row-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.row-actions button{font-size:.65rem;padding:.4rem .7rem}
.badge-disabled{font-family:var(--font-display);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--danger);border:1px solid var(--danger);padding:.15rem .4rem;border-radius:2px;margin-left:.5rem}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nubeti">
</head>
<body>
<a class="back" href="index.html">← Volver al catálogo</a>
<article id="content"><div class="loading">Cargando…</div></article>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth.js"></script>
<script>
let CATALOG = [];

(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  renderAuthBar(auth.profile);

  const article = document.getElementById('content');
  if (!auth.profile.is_admin) {
    article.innerHTML = `<div class="denied">No tienes acceso a esta página.<br><br><a href="dashboard.html" style="color:#FB602B">Ir a Mi Progreso →</a></div>`;
    return;
  }

  CATALOG = await fetch('data/catalog.json').then(r => r.json());
  await renderAdmin();
})();

async function renderAdmin() {
  const article = document.getElementById('content');
  const [profilesRes, progressRes] = await Promise.all([
    window.sb.from('profiles').select('*').order('email'),
    window.sb.from('progress').select('*'),
  ]);
  const totalCourses = CATALOG.length;
  const titleBySlug = Object.fromEntries(CATALOG.map(c => [c.slug, c.title_es]));
  const profiles = profilesRes.data || [];
  const progress = progressRes.data || [];

  const byUser = {};
  for (const p of profiles) byUser[p.id] = { profile: p, rows: [] };
  for (const row of progress) {
    if (byUser[row.user_id]) byUser[row.user_id].rows.push(row);
  }

  const users = Object.values(byUser).map(u => {
    const completed = u.rows.filter(r => r.completed).length;
    const scored = u.rows.filter(r => r.total);
    const avg = scored.length
      ? Math.round(scored.reduce((s, r) => s + (r.score / r.total), 0) / scored.length * 100)
      : null;
    return { ...u, completed, avg, pct: Math.round(completed / totalCourses * 100) };
  }).sort((a, b) => b.completed - a.completed);

  article.innerHTML = `
    <div class="kicker">◆ Panel de administración</div>
    <h1>Avance del equipo</h1>

    <div class="create-box">
      <h3>Crear nuevo usuario</h3>
      <div class="create-row">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="newName" placeholder="Nombre completo">
        </div>
        <div class="field">
          <label>Correo</label>
          <input type="email" id="newEmail" placeholder="correo@ejemplo.com">
        </div>
        <div class="field">
          <label>Contraseña temporal</label>
          <input type="text" id="newPassword" value="${generateTempPassword()}">
        </div>
        <button class="btn" id="createUserBtn">Crear usuario</button>
      </div>
      <div class="create-msg" id="createMsg"></div>
    </div>

    <table>
      <thead><tr><th>Usuario</th><th>Avance</th><th>Promedio quiz</th><th>Acciones</th></tr></thead>
      <tbody>
        ${users.map((u, i) => `
          <tr>
            <td><div class="name">${esc(u.profile.full_name || u.profile.email)}${u.profile.disabled ? '<span class="badge-disabled">Desactivado</span>' : ''}</div><div class="email">${esc(u.profile.email)}</div></td>
            <td>
              <div class="bar-cell">
                <div class="bar"><span style="width:${u.pct}%"></span></div>
                <div class="pct">${u.completed}/${totalCourses}</div>
              </div>
            </td>
            <td>${u.avg !== null ? u.avg + '%' : '—'}</td>
            <td>
              <div class="row-actions">
                <button class="btn ghost expand" data-i="${i}">Ver detalle</button>
                <button class="btn ghost reset-btn" data-id="${u.profile.id}" data-email="${esc(u.profile.email)}">Resetear contraseña</button>
                <button class="btn ${u.profile.disabled ? '' : 'danger'} toggle-btn" data-id="${u.profile.id}" data-disabled="${u.profile.disabled ? '1' : '0'}">${u.profile.disabled ? 'Activar' : 'Desactivar'}</button>
              </div>
            </td>
          </tr>
          <tr class="detail-row" id="detail-${i}">
            <td colspan="4">
              ${u.rows.length ? u.rows.map(r => `
                <div class="detail-course">
                  <span>${esc(titleBySlug[r.guide_slug] || r.guide_slug)}</span>
                  <span>${r.completed ? '✓' : '…'} ${r.total ? `${r.score}/${r.total}` : ''} ${r.attempts > 1 ? `· ${r.attempts} intentos` : ''}</span>
                </div>
              `).join('') : '<span style="color:var(--ink-mute)">Sin actividad todavía.</span>'}
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  document.querySelectorAll('.expand').forEach(el => {
    el.addEventListener('click', () => {
      document.getElementById(`detail-${el.dataset.i}`).classList.toggle('show');
    });
  });

  document.getElementById('createUserBtn').addEventListener('click', async () => {
    const btn = document.getElementById('createUserBtn');
    const msg = document.getElementById('createMsg');
    const email = document.getElementById('newEmail').value.trim();
    const password = document.getElementById('newPassword').value.trim();
    const full_name = document.getElementById('newName').value.trim();
    if (!email || !password) {
      msg.className = 'create-msg show err';
      msg.textContent = 'Falta el correo o la contraseña.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Creando…';
    const { data, error } = await callAdminApi('/api/admin-create-user', { email, password, full_name });
    btn.disabled = false;
    btn.textContent = 'Crear usuario';
    msg.className = 'create-msg show ' + (error ? 'err' : 'ok');
    msg.textContent = error
      ? `Error: ${error}`
      : `✓ Usuario creado. Compártele estas credenciales: ${email} / ${password} (deberá cambiarla al entrar).`;
    if (!error) await renderAdmin();
  });

  document.querySelectorAll('.reset-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const newPass = prompt(`Nueva contraseña temporal para ${btn.dataset.email}:`, generateTempPassword());
      if (!newPass) return;
      btn.disabled = true;
      const { error } = await callAdminApi('/api/admin-reset-password', { userId: btn.dataset.id, newPassword: newPass });
      btn.disabled = false;
      if (error) { alert('Error: ' + error); return; }
      alert(`Contraseña actualizada. Compártesela a ${btn.dataset.email}: ${newPass}`);
    });
  });

  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const disable = btn.dataset.disabled === '0';
      if (!confirm(disable ? '¿Desactivar esta cuenta? No podrá iniciar sesión.' : '¿Reactivar esta cuenta?')) return;
      btn.disabled = true;
      const { error } = await callAdminApi('/api/admin-toggle-user', { userId: btn.dataset.id, disable });
      btn.disabled = false;
      if (error) { alert('Error: ' + error); return; }
      await renderAdmin();
    });
  });
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
